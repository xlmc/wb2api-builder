name: Build and Push Docker Image

on:
  schedule:
    # 每天北京时间凌晨 02:00（UTC 18:00）自动检查原作者代码并构建
    - cron: '0 18 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout upstream repository
        uses: actions/checkout@v4
        with:
          repository: linguo2625469/workbuddy2api-panel
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/xlmc/workbuddy2api-panel:latest
          labels: |
            org.opencontainers.image.source=https://github.com/xlmc/wb2api-builder
          cache-from: type=gha
          cache-to: type=gha,mode=max
